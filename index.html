<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI 小手机</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="phone">
  <div class="phone-screen">
    <!-- 状态栏 -->
    <div class="status-bar" id="statusBar">
      <span class="time" id="statusTime">00:00</span>
      <span class="icons"><span>📶</span><span>🔋</span></span>
    </div>

    <!-- 主屏幕 -->
    <div class="page active" id="homePage">
      <div class="home-screen">
        <div class="grid">
          <div class="app-icon" id="goToWechat"><div class="icon-circle chat">💬</div><span class="icon-label">聊天</span></div>
          <div class="app-icon" id="goToSettingsFromHome"><div class="icon-circle settings">⚙️</div><span class="icon-label">设置</span></div>
          <div class="app-icon"><div class="icon-circle" style="background:#ff9500;">📁</div><span class="icon-label">文件</span></div>
          <div class="app-icon"><div class="icon-circle" style="background:#ff2d55;">🎵</div><span class="icon-label">音乐</span></div>
        </div>
        <div class="dock">
          <div class="app-icon" id="goToWechatFromDock"><div class="icon-circle chat">💬</div><span class="icon-label">聊天</span></div>
          <div class="app-icon" id="goToSettingsFromDock"><div class="icon-circle settings">⚙️</div><span class="icon-label">设置</span></div>
        </div>
      </div>
    </div>

    <!-- 设置 -->
    <div class="page" id="settingsPage">
      <div class="settings-page">
        <div class="header"><span class="back" id="backFromSettings">‹</span><span>设置</span></div>
        <div class="settings-list">
          <div class="settings-item" id="goToApiSettings"><span class="label">🔑 API 设置</span><span class="arrow">›</span></div>
          <div class="settings-item"><span class="label">📱 通用</span><span class="arrow">›</span></div>
          <div class="settings-item"><span class="label">ℹ️ 关于</span><span class="arrow">›</span></div>
        </div>
      </div>
    </div>

    <!-- API 设置 -->
    <div class="page" id="apiSettingsPage">
      <div class="api-settings-page">
        <div class="header"><span class="back" id="backFromApiSettings">‹</span><span>API 设置</span></div>
        <div class="api-group">
          <label>🔗 API 地址</label>
          <input id="apiBase" type="text" placeholder="https://api.deepseek.com/v1" value="https://api.deepseek.com/v1" />
          <label>🔑 API Key</label>
          <input id="apiKey" type="password" placeholder="sk-..." />
          <label>📦 模型</label>
          <div style="display:flex; gap:8px;">
            <select id="modelSelect" style="flex:1; margin-bottom:0;"><option value="">请先拉取</option></select>
            <button id="fetchModelsBtn" style="width:auto; padding:10px 16px; background:#34c759;">🔄</button>
          </div>
          <div style="display:flex; align-items:center; gap:12px; margin:12px 0 8px;">
            <label style="font-weight:600; margin-bottom:0;">⚡ 流式输出</label>
            <label class="switch"><input type="checkbox" id="streamToggle" /><span class="slider round"></span></label>
            <span style="font-size:13px; color:#8e8e93;" id="streamStatus">关闭</span>
          </div>
          <div class="status-msg" id="apiStatus">就绪</div>
          <button id="saveApiBtn" style="background:#8e8e93; margin-top:8px;">保存设置</button>
        </div>
      </div>
    </div>

    <!-- 微信风格聊天应用 -->
    <div class="wechat-app" id="wechatApp">
      <div class="tab-content" id="wechatTabContent"></div>
      <div class="tab-bar">
        <div class="tab active" data-tab="chats">💬 聊天</div>
        <div class="tab" data-tab="contacts">📇 通讯录</div>
      </div>
    </div>

    <!-- 聊天对话页 -->
    <div class="chat-dialog-page" id="chatDialogPage">
      <div class="chat-header">
        <span class="back" id="backFromDialog">‹</span>
        <div class="avatar" id="dialogAvatar">🧑</div>
        <div class="info">
          <div class="name" id="dialogName">角色</div>
          <div class="model" id="dialogModel">未选择</div>
        </div>
        <button class="new-btn" id="dialogNewBtn">新对话</button>
      </div>
      <div class="prompt-box" id="dialogPromptBox"></div>
      <div class="chat-body" id="dialogMessages"></div>
      <div class="chat-input-area">
        <textarea id="dialogInput" rows="1" placeholder="输入问题..."></textarea>
        <button id="dialogSendBtn">发送</button>
      </div>
    </div>

    <!-- 创建角色 -->
    <div class="page" id="createCharPage">
      <div class="api-settings-page">
        <div class="header">
          <span class="back" id="backFromCreateChar">‹</span>
          <span id="createCharTitle">新建 Char</span>
        </div>
        <div class="api-group">
          <label>头像</label>
          <div class="avatar-upload">
            <div class="avatar-preview" id="charAvatarPreview">🧑</div>
            <label class="upload-btn" id="avatarUploadBtn">选择图片</label>
            <input type="file" id="charAvatarInput" accept="image/*" />
          </div>
          <label>名字</label>
          <input id="charNameInput" placeholder="输入角色名字..." />
          <label>人设（系统提示词）</label>
          <textarea id="charPromptInput" placeholder="例如：你是一个温柔的小助理..."></textarea>
          <button id="saveCharBtn">保存</button>
          <div class="status-msg" id="createCharStatus"></div>
        </div>
      </div>
    </div>

    <!-- 角色详情页 -->
    <div class="page" id="contactDetailPage">
      <div class="api-settings-page">
        <div class="header">
          <span class="back" id="backFromContactDetail">‹</span>
          <span id="contactDetailTitle">角色详情</span>
        </div>
        <div class="api-group" id="detailContainer">
          <div id="viewMode">
            <div style="text-align:center; margin-bottom:12px;">
              <div class="avatar-preview" id="detailAvatar" style="width:80px;height:80px;margin:0 auto;font-size:36px;">🧑</div>
            </div>
            <div style="margin-bottom:10px;">
              <label style="font-weight:600;">名字</label>
              <div id="detailNameDisplay" style="padding:8px 12px;background:#f9f9f9;border-radius:8px;font-size:16px;">未命名</div>
            </div>
            <div style="margin-bottom:10px;">
              <label style="font-weight:600;">人设</label>
              <div id="detailPromptDisplay" style="padding:8px 12px;background:#f9f9f9;border-radius:8px;font-size:15px;min-height:60px;white-space:pre-wrap;">未设置</div>
            </div>
            <div style="display:flex;gap:10px;margin-top:8px;">
              <button id="detailEditBtn" style="flex:1;background:#007aff;">修改</button>
              <button id="detailDeleteBtn" style="flex:1;background:#ff3b30;">删除</button>
            </div>
          </div>
          <div id="editMode" style="display:none;">
            <div style="text-align:center;margin-bottom:12px;">
              <div class="avatar-preview" id="detailAvatarEdit" style="width:80px;height:80px;margin:0 auto;font-size:36px;">🧑</div>
            </div>
            <label>名字</label>
            <input id="detailNameInput" style="margin-bottom:10px;" />
            <label>人设</label>
            <textarea id="detailPromptInput" rows="4" style="margin-bottom:10px;"></textarea>
            <div style="display:flex;gap:10px;">
              <button id="detailSaveBtn" style="flex:1;background:#34c759;">保存修改</button>
              <button id="detailCancelBtn" style="flex:1;background:#8e8e93;">取消修改</button>
            </div>
          </div>
          <div class="status-msg" id="detailStatus"></div>
        </div>
      </div>
    </div>

    <!-- 普通聊天（保留但隐藏，供后续扩展） -->
    <div class="page" id="chatPage" style="display:none;">
      <div class="chat-page">
        <div class="chat-header">
          <span class="back" id="backFromChat">‹</span>
          <span class="title">💬 聊天</span>
          <span style="font-size:12px; color:#8e8e93; margin-right:4px;" id="modelDisplay2">未选择</span>
          <button class="new-btn" id="newChatBtn">新对话</button>
        </div>
        <div class="chat-body" id="chatMessages"></div>
        <div class="chat-input-area">
          <textarea id="userInput" rows="1" placeholder="输入问题..."></textarea>
          <button id="sendBtn">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/modules/app.js"></script>
</body>
</html>
