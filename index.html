<!DOCTYPE html>
<html lang="zh-CN" style="background-color: #F0F4FA !important; color-scheme: light !important;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#F0F4FA" />
  <title>小铃机</title>
  <style>
    /* 所有样式与之前一致，此处省略以节省篇幅 */
    /* 但实际代码中完整保留，下面直接提供完整文件 */
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <div class="phone-screen" id="phoneScreen">
    <!-- 状态栏 -->
    <div class="status-bar" id="statusBar">
      <span class="time" id="statusTime">00:00</span>
      <span class="icons">
        <svg width="20" height="16" viewBox="0 0 24 24" stroke="#C5C8F0" fill="#C5C8F0">
          <path d="M12 18c.8 0 1.5-.7 1.5-1.5S12.8 15 12 15s-1.5.7-1.5 1.5.7 1.5 1.5 1.5zm-3-3c1.7-1.7 4.3-1.7 6 0l1.4-1.4c-2.4-2.4-6.4-2.4-8.8 0L9 15zm-3-3c3.5-3.5 9.5-3.5 13 0l1.4-1.4c-4.4-4.4-11.4-4.4-15.8 0L6 12z"/>
        </svg>
        <svg width="26" height="16" viewBox="0 0 24 24" stroke="none" fill="#C5C8F0">
          <rect x="2" y="6" width="18" height="12" rx="2" stroke="#C5C8F0" stroke-width="1.5" fill="none"/>
          <path d="M22 10v4" stroke="#C5C8F0" stroke-width="1.5" stroke-linecap="round"/>
          <rect x="4" y="8" width="12" height="8" rx="1" fill="#C5C8F0"/>
        </svg>
      </span>
    </div>

    <!-- 主屏幕 -->
    <div class="page active" id="homePage">
      <div class="home-screen">
        <div class="grid">
          <div class="app-icon" id="goToWechat"><div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M4 10.5 C4 6, 7.5 4, 12 4 C16.5 4, 20 6, 20 10.5 C20 15, 16.5 17, 12 17 L10.5 20 L9 17 C7.5 17, 4 15, 4 10.5 Z" fill="#C5C8F0" stroke="none"/></svg></div><span class="icon-label">聊天</span></div>
          <div class="app-icon" id="goToSettingsFromHome"><div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8z" fill="#C5C8F0"/><circle cx="12" cy="12" r="3" fill="#C5C8F0"/></svg></div><span class="icon-label">设置</span></div>
          <div class="app-icon" id="goToNovel"><div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5z" fill="#C5C8F0"/><path d="M3 9h18" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M7 13h4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg></div><span class="icon-label">小说</span></div>
          <div class="app-icon" id="goToMusic"><div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M9 18V5l10-3v13" stroke="#C5C8F0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="#C5C8F0" stroke="none"/><circle cx="16" cy="16" r="3" fill="#C5C8F0" stroke="none"/></svg></div><span class="icon-label">音乐</span></div>
        </div>
        <div class="dock">
          <div class="app-icon" id="goToWechatFromDock"><div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M4 10.5 C4 6, 7.5 4, 12 4 C16.5 4, 20 6, 20 10.5 C20 15, 16.5 17, 12 17 L10.5 20 L9 17 C7.5 17, 4 15, 4 10.5 Z" fill="#C5C8F0" stroke="none"/></svg></div><span class="icon-label">聊天</span></div>
          <div class="app-icon" id="goToSettingsFromDock"><div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8z" fill="#C5C8F0"/><circle cx="12" cy="12" r="3" fill="#C5C8F0"/></svg></div><span class="icon-label">设置</span></div>
        </div>
      </div>
    </div>

    <!-- 设置页面 -->
    <div class="page" id="settingsPage">
      <div class="settings-page">
        <div class="header"><span class="back" id="backFromSettings">‹</span><span>设置</span></div>
        <div class="settings-list">
          <div class="settings-item" id="goToApiSettings"><span class="label">🔑 API 设置</span><span class="arrow">›</span></div>
          <div class="settings-item" id="forceRefreshBtn"><span class="label">🔄 强制刷新</span><span class="arrow">›</span></div>
          <div class="settings-item"><span class="label">ℹ️ 关于</span><span class="arrow">›</span></div>
          <div class="settings-item" style="border-bottom: none; cursor: default; background: transparent;">
            <span class="label" style="font-size:13px; color:#8a9aa8;">📦 版本信息</span>
            <span class="arrow" style="font-size:12px; color:#8a9aa8;" id="versionInfo">加载中...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- API 设置 -->
    <div class="page" id="apiSettingsPage">
      <div class="api-settings-page">
        <div class="header"><span class="back" id="backFromApiSettings">‹</span><span>API 设置</span></div>
        <div class="api-group">
          <label>🔗 API 地址</label>
          <input id="apiBase" type="text" placeholder="https://api.deepseek.com/v1" value="https://api.deepseek.com/v1" />
          <label>🔑 API Key</label>
          <input id="apiKey" type="password" placeholder="sk-..." />
          <label>📦 模型</label>
          <div style="display:flex; gap:8px;">
            <select id="modelSelect" style="flex:1; margin-bottom:0;"><option value="">请先拉取</option></select>
            <button id="fetchModelsBtn" style="width:auto; padding:10px 16px; background:var(--btn);">🔄</button>
          </div>
          <div style="display:flex; align-items:center; gap:12px; margin:12px 0 8px;">
            <label style="font-weight:600; margin-bottom:0;">⚡ 流式输出</label>
            <label class="switch"><input type="checkbox" id="streamToggle" /><span class="slider round"></span></label>
            <span style="font-size:13px; color:#6a7a8a;" id="streamStatus">关闭</span>
          </div>
          <div class="status-msg" id="apiStatus">就绪</div>
          <button id="saveApiBtn" style="background:var(--btn); margin-top:8px;">保存设置</button>
        </div>
      </div>
    </div>

    <!-- 小说 -->
    <div class="page" id="novelPage">
      <div class="reader-page">
        <div class="header"><span class="back" id="backFromNovel">‹</span><span>📖 小说</span></div>
        <div class="content-area">
          <div class="file-input-wrap"><button id="importNovelBtn">📂 导入小说</button><input type="file" id="novelFileInput" accept=".txt" style="display:none;" /></div>
          <div class="novel-content" id="novelContent">点击「导入小说」选择 .txt 文件阅读</div>
        </div>
      </div>
    </div>

    <!-- 音乐 -->
    <div class="page" id="musicPage">
      <div class="music-page">
        <div class="header"><span class="back" id="backFromMusic">‹</span><span>🎵 音乐</span></div>
        <div class="content-area">
          <div class="file-input-wrap"><button id="importMusicBtn">📂 导入 MP3</button><input type="file" id="musicFileInput" accept=".mp3" style="display:none;" /></div>
          <div class="music-controls"><button id="playPauseBtn">▶️ 播放</button></div>
          <div class="music-info" id="musicInfo">未加载音乐</div>
          <audio id="audioPlayer" style="display:none;"></audio>
        </div>
      </div>
    </div>

    <!-- 微信应用 -->
    <div class="wechat-app" id="wechatApp">
      <div class="top-bar">
        <span class="back" id="wechatBack">‹</span>
        <span class="title" id="wechatTitle">聊天</span>
        <span style="width:24px;"></span>
      </div>
      <div class="tab-content" id="wechatTabContent"></div>
      <div class="tab-bar">
        <div class="tab active" data-tab="chats">💬 聊天</div>
        <div class="tab" data-tab="contacts">📇 通讯录</div>
        <div class="tab" data-tab="moments">🌐 朋友圈</div>
        <div class="tab" data-tab="profile">👤 我的</div>
      </div>
    </div>

    <!-- 聊天对话页 -->
    <div class="chat-dialog-page" id="chatDialogPage">
      <div class="chat-header">
        <span class="back" id="backFromDialog">‹</span>
        <div class="avatar" id="dialogAvatar">🧑</div>
        <div class="info"><div class="name" id="dialogName">角色</div><div class="model" id="dialogModel">未选择</div></div>
        <button class="new-btn" id="dialogNewBtn">新对话</button>
      </div>
      <div class="prompt-box" id="dialogPromptBox"></div>
      <div class="chat-body" id="dialogMessages"></div>
      <div class="chat-input-area">
        <textarea id="dialogInput" rows="1" placeholder="输入问题..."></textarea>
        <button id="dialogSendBtn" title="发送消息（暂存）">📤</button>
        <button id="dialogReplyBtn" title="AI 回答">⚡ <span id="replyCount">0</span></button>
      </div>
    </div>

    <!-- 创建角色 -->
    <div class="page" id="createCharPage">
      <div class="api-settings-page">
        <div class="header"><span class="back" id="backFromCreateChar">‹</span><span id="createCharTitle">新建 Char</span></div>
        <div class="api-group">
          <label>头像</label>
          <div class="avatar-upload">
            <div class="avatar-preview" id="charAvatarPreview">🧑</div>
            <label class="upload-btn" id="avatarUploadBtn">选择图片</label>
            <input type="file" id="charAvatarInput" accept="image/*" />
          </div>
          <label>名字</label>
          <input id="charNameInput" placeholder="输入角色名字..." />
          <label>个性签名</label>
          <input id="charBioInput" placeholder="一句话描述..." />
          <label>人设（系统提示词）</label>
          <textarea id="charPromptInput" placeholder="例如：你是一个温柔的小助理..."></textarea>
          <button id="saveCharBtn">保存</button>
          <div class="status-msg" id="createCharStatus"></div>
        </div>
      </div>
    </div>

    <!-- 角色详情页 -->
    <div class="page" id="contactDetailPage">
      <div class="api-settings-page">
        <div class="header"><span class="back" id="backFromContactDetail">‹</span><span id="contactDetailTitle">角色详情</span></div>
        <div class="api-group" id="detailContainer">
          <div id="viewMode">
            <div style="text-align:center; margin-bottom:12px;">
              <div class="avatar-preview" id="detailAvatar" style="width:80px;height:80px;margin:0 auto;font-size:36px;cursor:default;">🧑</div>
              <div style="font-size:12px; color:#6a7a8a; margin-top:4px;" id="avatarHint">点击修改进入编辑</div>
              <input type="file" id="detailAvatarInput" accept="image/*" style="display:none;" />
            </div>
            <div style="margin-bottom:10px;"><label style="font-weight:600;">名字</label><div id="detailNameDisplay" style="padding:8px 12px;background:rgba(255,255,255,0.5);border-radius:8px;font-size:16px;">未命名</div></div>
            <div style="margin-bottom:10px;"><label style="font-weight:600;">个性签名</label><div id="detailBioDisplay" style="padding:8px 12px;background:rgba(255,255,255,0.5);border-radius:8px;font-size:15px;">未设置</div></div>
            <div style="margin-bottom:10px;"><label style="font-weight:600;">人设</label><div id="detailPromptDisplay" style="padding:8px 12px;background:rgba(255,255,255,0.5);border-radius:8px;font-size:15px;min-height:60px;white-space:pre-wrap;">未设置</div></div>
            <div style="display:flex;gap:10px;margin-top:8px;">
              <button id="detailEditBtn" style="flex:1;background:var(--btn);">修改</button>
              <button id="detailDeleteBtn" style="flex:1;background:#e8b4b8;color:#1c1c1e;">删除</button>
            </div>
          </div>
          <div id="editMode" style="display:none;">
            <div style="text-align:center;margin-bottom:12px;">
              <div class="avatar-preview" id="detailAvatarEdit" style="width:80px;height:80px;margin:0 auto;font-size:36px;cursor:pointer;">🧑</div>
              <div style="font-size:12px; color:#6a7a8a; margin-top:4px;">点击头像更换</div>
            </div>
            <label>名字</label>
            <input id="detailNameInput" style="margin-bottom:10px;" />
            <label>个性签名</label>
            <input id="detailBioInput" style="margin-bottom:10px;" />
            <label>人设</label>
            <textarea id="detailPromptInput" rows="4" style="margin-bottom:10px;"></textarea>
            <div style="display:flex;gap:10px;">
              <button id="detailSaveBtn" style="flex:1;background:#9db8d0;color:#1c1c1e;">保存修改</button>
              <button id="detailCancelBtn" style="flex:1;background:var(--btn);">取消修改</button>
            </div>
          </div>
          <div class="status-msg" id="detailStatus"></div>
        </div>
      </div>
    </div>

    <!-- 个人资料编辑页 -->
    <div class="page" id="profileEditPage">
      <div class="profile-edit-page">
        <div class="header">
          <span class="back" id="backFromProfileEdit">‹</span>
          <span>编辑资料</span>
        </div>
        <div class="avatar-large" id="profileEditAvatar">👤</div>
        <input type="file" id="profileEditAvatarInput" accept="image/*" style="display:none;" />
        <div class="input-group">
          <label>昵称</label>
          <input id="profileEditName" value="我" />
        </div>
        <div class="input-group">
          <label>个性签名</label>
          <textarea id="profileEditSig">这个人很懒，什么都没写</textarea>
        </div>
        <div class="input-group">
          <label>我的人设（AI眼中的我）</label>
          <textarea id="profileEditPersona" placeholder="例如：我是一个喜欢旅行和摄影的人..."></textarea>
        </div>
        <button class="save-btn" id="profileEditSaveBtn">保存修改</button>
      </div>
    </div>

    <!-- 朋友圈发布编辑器 -->
    <div class="moment-editor" id="momentEditor">
      <div class="header">
        <span class="title" id="editorTitle">发布动态</span>
        <span class="close-btn" id="editorClose">✕</span>
      </div>
      <textarea id="momentText" placeholder="说点什么..."></textarea>
      <div class="image-grid" id="imageGrid"></div>
      <button class="publish-btn" id="publishMomentBtn2">发布</button>
    </div>

  </div>
</div>

<script>
// ============================================================
// 存储工具
// ============================================================
function getChars() {
  try { return JSON.parse(localStorage.getItem('chars')) || []; } catch (e) { return []; }
}
function saveChars(chars) {
  localStorage.setItem('chars', JSON.stringify(chars));
}
function getCharHistory(charId) {
  try { return JSON.parse(localStorage.getItem('charHistory_' + charId)) || []; } catch (e) { return []; }
}
function saveCharHistory(charId, history) {
  localStorage.setItem('charHistory_' + charId, JSON.stringify(history));
}
function getProfile() {
  try { return JSON.parse(localStorage.getItem('userProfile')) || { name: '我', signature: '这个人很懒，什么都没写', avatar: null, cover: null, persona: '' }; } catch (e) { return { name: '我', signature: '这个人很懒，什么都没写', avatar: null, cover: null, persona: '' }; }
}
function saveProfile(profile) {
  localStorage.setItem('userProfile', JSON.stringify(profile));
}
function getMoments() {
  try { return JSON.parse(localStorage.getItem('moments')) || []; } catch (e) { return []; }
}
function saveMoments(moments) {
  localStorage.setItem('moments', JSON.stringify(moments));
}

// ============================================================
// 导航
// ============================================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('wechatApp').classList.remove('active');
  document.getElementById('chatDialogPage').classList.remove('active');
  document.getElementById('momentEditor').classList.remove('show');
  const target = document.getElementById(id);
  if (target) target.classList.add('active');
}
function showWechat(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('wechatApp').classList.add('active');
  document.getElementById('chatDialogPage').classList.remove('active');
  document.getElementById('momentEditor').classList.remove('show');
  if (tab) {
    document.querySelectorAll('.wechat-app .tab').forEach(t => t.classList.remove('active'));
    const targetTab = document.querySelector(`.wechat-app .tab[data-tab="${tab}"]`);
    if (targetTab) targetTab.classList.add('active');
  }
  renderWechatContent();
}
function goHome() { showPage('homePage'); }

document.getElementById('goToWechat').addEventListener('click', () => showWechat('chats'));
document.getElementById('goToWechatFromDock').addEventListener('click', () => showWechat('chats'));
document.getElementById('goToSettingsFromHome').addEventListener('click', () => showPage('settingsPage'));
document.getElementById('goToSettingsFromDock').addEventListener('click', () => showPage('settingsPage'));
document.getElementById('backFromSettings').addEventListener('click', goHome);
document.getElementById('backFromApiSettings').addEventListener('click', () => showPage('settingsPage'));
document.getElementById('goToApiSettings').addEventListener('click', () => showPage('apiSettingsPage'));
document.getElementById('wechatBack').addEventListener('click', goHome);
document.getElementById('forceRefreshBtn').addEventListener('click', function() {
  if (confirm('确定要强制刷新页面吗？将重新加载所有资源。')) location.reload(true);
});
document.getElementById('goToNovel').addEventListener('click', () => showPage('novelPage'));
document.getElementById('backFromNovel').addEventListener('click', goHome);
document.getElementById('goToMusic').addEventListener('click', () => showPage('musicPage'));
document.getElementById('backFromMusic').addEventListener('click', goHome);
document.getElementById('backFromCreateChar').addEventListener('click', () => { renderWechatContent(); showWechat('contacts'); });
document.getElementById('backFromContactDetail').addEventListener('click', () => {
  if (isEditing) {
    document.getElementById('detailNameInput').value = originalName;
    document.getElementById('detailBioInput').value = originalBio;
    document.getElementById('detailPromptInput').value = originalPrompt;
    document.getElementById('viewMode').style.display = 'block';
    document.getElementById('editMode').style.display = 'none';
    isEditing = false;
    document.getElementById('detailStatus').textContent = '';
  }
  renderWechatContent(); showWechat('contacts');
});
document.getElementById('backFromProfileEdit').addEventListener('click', () => { renderWechatContent(); showWechat('profile'); });
document.getElementById('editorClose').addEventListener('click', closeEditor);

document.querySelectorAll('.wechat-app .tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.wechat-app .tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    renderWechatContent();
  });
});

// ============================================================
// 状态栏时间
// ============================================================
function updateTime() {
  const now = new Date();
  document.getElementById('statusTime').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}
updateTime();
setInterval(updateTime, 10000);

// ============================================================
// 全屏适配
// ============================================================
const phoneContainer = document.getElementById('phoneContainer');
const phoneScreen = document.getElementById('phoneScreen');
function applyFullscreen() {
  const h = window.innerHeight;
  const w = window.innerWidth;
  phoneContainer.style.width = w + 'px';
  phoneContainer.style.height = h + 'px';
  phoneScreen.style.height = h + 'px';
}
applyFullscreen();
window.addEventListener('resize', applyFullscreen);
if (window.matchMedia('(display-mode: standalone)').matches) {
  applyFullscreen();
}

// ============================================================
// API 设置
// ============================================================
const apiBase = document.getElementById('apiBase');
const apiKey = document.getElementById('apiKey');
const modelSelect = document.getElementById('modelSelect');
const fetchModelsBtn = document.getElementById('fetchModelsBtn');
const saveApiBtn = document.getElementById('saveApiBtn');
const apiStatus = document.getElementById('apiStatus');
const streamToggle = document.getElementById('streamToggle');
const streamStatus = document.getElementById('streamStatus');
streamToggle.addEventListener('change', () => {
  streamStatus.textContent = streamToggle.checked ? '开启' : '关闭';
  localStorage.setItem('streamEnabled', streamToggle.checked ? 'true' : 'false');
});
function loadStreamSetting() {
  const saved = localStorage.getItem('streamEnabled');
  if (saved === 'true') { streamToggle.checked = true; streamStatus.textContent = '开启'; }
  else { streamToggle.checked = false; streamStatus.textContent = '关闭'; }
}
loadStreamSetting();

let currentDialogCharId = null;
let editingCharId = null;
let avatarDataUrl = null;
let detailCharId = null;
let isEditing = false;
let originalName = '';
let originalBio = '';
let originalPrompt = '';

// ============================================================
// 微信风格渲染 (4个tab)
// ============================================================
function renderWechatContent() {
  const container = document.getElementById('wechatTabContent');
  const activeTab = document.querySelector('.wechat-app .tab.active')?.dataset.tab || 'chats';
  document.getElementById('wechatTitle').textContent =
    activeTab === 'chats' ? '聊天' :
    activeTab === 'contacts' ? '通讯录' :
    activeTab === 'moments' ? '朋友圈' : '我的';

  if (activeTab === 'chats') renderChatList(container);
  else if (activeTab === 'contacts') renderContactList(container);
  else if (activeTab === 'moments') renderMoments(container);
  else if (activeTab === 'profile') renderProfile(container);
}

function renderChatList(container) {
  const chars = getChars();
  if (chars.length === 0) {
    container.innerHTML = `<div class="empty-state">📭 还没有联系人<br>去通讯录添加吧</div>`;
    return;
  }
  let html = `<div style="background:var(--bg);padding:10px 16px;font-size:14px;color:#6a7a8a;">最近聊天</div>`;
  chars.forEach(c => {
    const history = getCharHistory(c.id);
    const lastMsg = history.length > 0 ? history[history.length-1] : null;
    const preview = lastMsg ? (lastMsg.content || '') : '暂无消息';
    const time = lastMsg ? new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) : '';
    const avatarHtml = c.avatar ? `<img src="${c.avatar}" />` : '🧑';
    html += `
      <div class="list-item" data-id="${c.id}">
        <div class="avatar">${avatarHtml}</div>
        <div class="info"><div class="name">${c.name || '未命名'}</div><div class="preview">${preview}</div></div>
        <div class="time">${time}</div>
      </div>
    `;
  });
  container.innerHTML = html;
  container.querySelectorAll('.list-item').forEach(el => {
    el.addEventListener('click', () => {

let editingMomentIndex = null;

function openEditor(editIndex = null) {
  editingMomentIndex = editIndex;

  }
  editor.classList.add('show');
  textarea.focus();

function closeEditor() {
  document.getElementById('momentEditor').classList.remove('show');
  editingMomentIndex = null;
}

function renderImageGrid(container, images) {
  const maxSlots = 9;
  let html = '';
  for (let i = 0; i < maxSlots; i++) {
    if (i < images.length) {
      const img = images[i];
      html += `
        <div class="slot" data-index="${i}">
          <img src="${img}" />
          <span class="remove-btn" data-index="${i}">✕</span>
        </div>
      `;
    } else if (i === images.length && images.length < maxSlots) {
      html += `<div class="slot" id="addImageSlot">+</div>`;
    } else {
      html += `<div class="slot" style="border:none;background:transparent;"></div>`;
    }
  }
  container.innerHTML = html;

  const addSlot = document.getElementById('addImageSlot');
  if (addSlot) {
    addSlot.addEventListener('click', function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
          const dataUrl = ev.target.result;
          let images = [];
          if (editingMomentIndex !== null) {
            const moments = getMoments();
            images = moments[editingMomentIndex].images || [];
          } else {
            const slots = container.querySelectorAll('.slot img');
            slots.forEach(img => { if (img && img.src) images.push(img.src); });
          }
          if (images.length >= 9) { alert('最多添加9张图片'); return; }
          images.push(dataUrl);
          if (editingMomentIndex !== null) {
            const moments = getMoments();
            moments[editingMomentIndex].images = images;
            saveMoments(moments);
          }
          renderImageGrid(container, images);
        };
        reader.readAsDataURL(file);
      };
      input.click();
    });
  }

  container.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const idx = parseInt(this.dataset.index);
      let images = [];
      if (editingMomentIndex !== null) {
        const moments = getMoments();
        images = moments[editingMomentIndex].images || [];
        images.splice(idx, 1);
        moments[editingMomentIndex].images = images;
        saveMoments(moments);
      } else {
        const slots = container.querySelectorAll('.slot img');
        const temp = [];
        slots.forEach(img => { if (img && img.src) temp.push(img.src); });
        temp.splice(idx, 1);
        images = temp;
      }
      renderImageGrid(container, images);
    });
  });
}

function renderMoments(container) {
  const profile = getProfile();
  const moments = getMoments();
  let html = `
    <div class="moments-cover" id="coverUpload">
      ${profile.cover ? `<img src="${profile.cover}" />` : '<div style="width:100%;height:100%;background:linear-gradient(135deg,#d5e0ec,#b8cce0);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;">点击上传封面</div>'}

    </div>
    <input type="file" id="coverFileInput" accept="image/*" style="display:none;" />
    <div class="moments-profile">
      <div class="avatar">${profile.avatar ? `<img src="${profile.avatar}" />` : '👤'}</div>
      <div class="info"><div class="name">${profile.name}</div><div class="sig">${profile.signature}</div></div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <button id="publishMomentBtn" style="background:var(--btn);color:#1c1c1e;border:none;border-radius:16px;padding:6px 16px;font-size:14px;cursor:pointer;">+ 发布动态</button>
    </div>
    <div id="momentsList"></div>
  `;
  container.innerHTML = html;

  document.getElementById('coverUpload').addEventListener('click', () => document.getElementById('coverFileInput').click());
  document.getElementById('coverFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const profile = getProfile();
      profile.cover = ev.target.result;
      saveProfile(profile);
      renderWechatContent();
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('publishMomentBtn').addEventListener('click', function() {
    openEditor(null);
  });

  const list = document.getElementById('momentsList');
  const momentsData = getMoments();
  if (momentsData.length === 0) {
    list.innerHTML = `<div class="empty-state">还没有动态，发布一条吧</div>`;
  } else {
    const profile = getProfile();
    let items = '';
    momentsData.slice().reverse().forEach((m, idx) => {
      const realIdx = momentsData.length - 1 - idx;
      const avatarHtml = profile.avatar ? `<img src="${profile.avatar}" />` : '👤';
      const likedClass = m.liked ? 'liked' : '';
      const likeText = m.liked ? '❤️ 取消赞' : '🤍 赞';
      let imagesHtml = '';
      if (m.images && m.images.length > 0) {
        imagesHtml = '<div class="image-grid">';
        m.images.forEach(img => {
          imagesHtml += `<div class="img-slot"><img src="${img}" /></div>`;
        });
        imagesHtml += '</div>';
      }
      items += `
        <div class="moment-card">
          <div class="header">
            <div class="avatar">${avatarHtml}</div>
            <span class="name">${profile.name}</span>
            <span class="time">${new Date(m.time).toLocaleString('zh-CN', {hour:'2-digit',minute:'2-digit',month:'short',day:'numeric'})}</span>
          </div>
          <div class="content">${m.text}</div>
          ${imagesHtml}
          <div class="actions">
            <span class="${likedClass}" data-idx="${realIdx}">${likeText}</span>
            <span class="comment-btn" data-idx="${realIdx}">💬 评论</span>
            <span class="edit-btn" data-idx="${realIdx}">✎ 编辑</span>
            <span class="delete-btn" data-idx="${realIdx}">🗑️ 删除</span>
          </div>
          ${m.comments && m.comments.length > 0 ? `<div class="comments">${m.comments.map(c => `<div class="comment"><span class="name">${c.name || '我'}</span>：${c.text}</div>`).join('')}</div>` : ''}
        </div>
      `;
    });
    list.innerHTML = items;

    list.querySelectorAll('.actions .liked, .actions .comment-btn, .actions .edit-btn, .actions .delete-btn').forEach(el => {
      el.addEventListener('click', function(e) {
        const idx = parseInt(this.dataset.idx);
        const moments = getMoments();
        if (this.classList.contains('liked') || this.textContent.includes('赞')) {
          moments[idx].liked = !moments[idx].liked;
          moments[idx].likes += moments[idx].liked ? 1 : -1;
          saveMoments(moments);
          renderWechatContent();
        } else if (this.classList.contains('comment-btn')) {
          const commentText = prompt('输入评论：');
          if (commentText && commentText.trim() !== '') {
            const profile = getProfile();
            moments[idx].comments = moments[idx].comments || [];
            moments[idx].comments.push({ name: profile.name, text: commentText.trim() });
            saveMoments(moments);
            renderWechatContent();
          }
        } else if (this.classList.contains('edit-btn')) {
          openEditor(idx);
        } else if (this.classList.contains('delete-btn')) {
          if (confirm('确定删除这条动态吗？')) {
            moments.splice(idx, 1);
            saveMoments(moments);
            renderWechatContent();
          }
        }
      });
    });
  }
}

function updateDialogPrompt() {

  const chars = getChars();
  const char = chars.find(c => c.id === currentDialogCharId);
  if (char && char.prompt) {

}
document.getElementById('dialogAvatar').addEventListener('click', () => {
  document.getElementById('dialogPromptBox').classList.toggle('show');
});

function renderDialogMessages() {
  const container = document.getElementById('dialogMessages');
  if (!currentDialogCharId) { container.innerHTML = ''; return; }
  const history = getCharHistory(currentDialogCharId);
  if (history.length === 0) {
    container.innerHTML = `<div style="color:#6a7a8a;text-align:center;padding:40px 0;font-size:16px;">开始对话吧 💬</div>`;
    return;
  }
  let html = '';
  history.forEach(msg => {
    const t = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
    const isPending = msg.role === 'user' && msg.replied === false;
    const pendingClass = isPending ? ' style="opacity:0.7;border:1px dashed #8a9aa8;"' : '';
    html += `<div class="message ${msg.role}"${pendingClass}>${msg.content}<div class="msg-time">${t}${isPending ? ' ⏳' : ''}</div></div>`;
  });
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function addDialogMessage(role, content, replied = true) {
  if (!currentDialogCharId) return;
  const history = getCharHistory(currentDialogCharId);
  history.push({ role, content, replied });
  saveCharHistory(currentDialogCharId, history);
  renderDialogMessages();
  renderWechatContent();
}

function updateReplyCount() {
  if (!currentDialogCharId) return;
  const history = getCharHistory(currentDialogCharId);
  const count = history.filter(m => m.role === 'user' && m.replied === false).length;
  document.getElementById('replyCount').textContent = count;
}

// 发送按钮（只添加用户消息，不触发AI）
document.getElementById('dialogSendBtn').addEventListener('click', function() {
  const msg = document.getElementById('dialogInput').value.trim();
  if (!msg) { alert('请输入内容'); return; }
  if (!currentDialogCharId) { alert('请先选择角色'); return; }
  addDialogMessage('user', msg, false);
  document.getElementById('dialogInput').value = '';
  document.getElementById('dialogInput').style.height = 'auto';
  updateReplyCount();
});

// AI回答按钮（批量处理未回复消息）
document.getElementById('dialogReplyBtn').addEventListener('click', async function() {
  if (!currentDialogCharId) { alert('请先选择角色'); return; }
  const base = apiBase.value.trim(), key = apiKey.value.trim(), model = modelSelect.value;
  if (!base || !key) { alert('请先设置 API'); showPage('apiSettingsPage'); return; }
  if (!model) { alert('请先选择模型'); return; }

  const history = getCharHistory(currentDialogCharId);
  const pending = history.filter(m => m.role === 'user' && m.replied === false);
  if (pending.length === 0) { alert('没有待回复的消息'); return; }

  // 构建消息数组：系统人设 + 所有历史（包括pending）
  const chars = getChars();
  const char = chars.find(c => c.id === currentDialogCharId);
  const messages = [];
  const profile = getProfile();
  if (profile.persona) {
    messages.push({ role: 'system', content: '用户人设：' + profile.persona });
  }
  if (char && char.prompt) {
    messages.push({ role: 'system', content: char.prompt });
  }
  // 只取已回复的历史 + 全部pending（保持顺序）
  const allHistory = getCharHistory(currentDialogCharId);
  allHistory.forEach(m => {
    if (m.role === 'user' || m.role === 'assistant') {
      messages.push({ role: m.role, content: m.content });
    }
  });

  // 显示思考中
  const thinkingIdx = messages.length;
  // 不实际添加thinking消息，直接调用API

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'chat', baseUrl: base, apiKey: key, model, messages, stream: false })
    });
    const data = await res.json();
    if (data.reply) {
      // 标记所有pending为已回复
      let hist = getCharHistory(currentDialogCharId);
      hist.forEach(m => {
        if (m.role === 'user' && m.replied === false) {
          m.replied = true;
        }
      });
      saveCharHistory(currentDialogCharId, hist);
      // 添加AI回复
      addDialogMessage('assistant', data.reply);
      updateReplyCount();
    } else {
      alert('AI 没有返回回复');
    }
  } catch (e) {
    alert('请求失败：' + e.message);
  }
});

  if (!newName) { document.getElementById('detailStatus').textContent = '❌ 名字不能为空'; return; }
  let chars = getChars();
  const idx = chars.findIndex(c => c.id === detailCharId);
  if (idx !== -1) {
    chars[idx].name = newName;
    chars[idx].bio = newBio;
    chars[idx].prompt = newPrompt;
    saveChars(chars);
    document.getElementById('detailNameDisplay').textContent = newName;
    document.getElementById('detailBioDisplay').textContent = newBio || '未设置';
    document.getElementById('detailPromptDisplay').textContent = newPrompt || '未设置';
    originalName = newName; originalBio = newBio; originalPrompt = newPrompt;
    document.getElementById('detailStatus').textContent = '✅ 保存成功！';
    document.getElementById('viewMode').style.display = 'block';
    document.getElementById('editMode').style.display = 'none';
    isEditing = false;
    document.getElementById('avatarHint').textContent = '点击修改进入编辑';
    renderWechatContent();
    setTimeout(() => { document.getElementById('detailStatus').textContent = ''; }, 2000);
  }
});
document.getElementById('detailCancelBtn').addEventListener('click', () => {
  if (!detailCharId) return;
  document.getElementById('detailNameInput').value = originalName;
  document.getElementById('detailBioInput').value = originalBio;
  document.getElementById('detailPromptInput').value = originalPrompt;
  document.getElementById('viewMode').style.display = 'block';
  document.getElementById('editMode').style.display = 'none';
  isEditing = false;
  document.getElementById('avatarHint').textContent = '点击修改进入编辑';
  document.getElementById('detailStatus').textContent = '';
});
document.getElementById('detailDeleteBtn').addEventListener('click', () => {
  if (!detailCharId) return;
  if (!confirm('确定删除这个角色吗？')) return;
  let chars = getChars();
  chars = chars.filter(c => c.id !== detailCharId);
  saveChars(chars);
  localStorage.removeItem('charHistory_' + detailCharId);
  if (currentDialogCharId === detailCharId) currentDialogCharId = null;
  renderWechatContent();
  showWechat('contacts');
});

// ============================================================
// 创建角色
// ============================================================
document.getElementById('avatarUploadBtn').addEventListener('click', () => document.getElementById('charAvatarInput').click());
document.getElementById('charAvatarInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    avatarDataUrl = ev.target.result;
    document.getElementById('charAvatarPreview').innerHTML = `<img src="${avatarDataUrl}" />`;
  };
  reader.readAsDataURL(file);
});
document.getElementById('saveCharBtn').addEventListener('click', () => {
  const name = document.getElementById('charNameInput').value.trim();
  const bio = document.getElementById('charBioInput').value.trim();
  const prompt = document.getElementById('charPromptInput').value.trim();
  if (!name) { document.getElementById('createCharStatus').textContent = '❌ 请填写名字'; return; }
  if (!prompt) { document.getElementById('createCharStatus').textContent = '❌ 请填写人设'; return; }
  let chars = getChars();
  if (editingCharId) {
    const idx = chars.findIndex(c => c.id === editingCharId);
    if (idx !== -1) { chars[idx].name = name; chars[idx].bio = bio; chars[idx].prompt = prompt; if (avatarDataUrl) chars[idx].avatar = avatarDataUrl; }
  } else {
    chars.push({ id: 'char_' + Date.now(), name, bio, prompt, avatar: avatarDataUrl || null, created: Date.now() });
  }
  saveChars(chars);
  document.getElementById('createCharStatus').textContent = '✅ 保存成功！';
  setTimeout(() => { renderWechatContent(); showWechat('contacts'); }, 500);
});

// ============================================================
// 设置 & 模型
// ============================================================
function loadSettings() {
  const savedBase = localStorage.getItem('apiBase');
  const savedKey = localStorage.getItem('apiKey');
  const savedModel = localStorage.getItem('selectedModel');
  if (savedBase) apiBase.value = savedBase;
  if (savedKey) apiKey.value = savedKey;
  if (savedModel) window._savedModel = savedModel;
}
function saveSettings(includeModel) {
  localStorage.setItem('apiBase', apiBase.value.trim());
  localStorage.setItem('apiKey', apiKey.value.trim());
  if (includeModel && modelSelect.value) localStorage.setItem('selectedModel', modelSelect.value);
  apiStatus.textContent = '✅ 已保存';
  setTimeout(() => { if (apiStatus.textContent === '✅ 已保存') apiStatus.textContent = '就绪'; }, 2000);
}
loadSettings();

fetchModelsBtn.addEventListener('click', async () => {
  const base = apiBase.value.trim(), key = apiKey.value.trim();
  if (!base || !key) { apiStatus.textContent = '❌ 请填写地址和Key'; return; }
  saveSettings(false);
  apiStatus.textContent = '📥 拉取中...';
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'models', baseUrl: base, apiKey: key })
    });
    const data = await res.json();
    if (data.models) {
      modelSelect.innerHTML = '<option value="">请选择</option>';
      data.models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id || m;
        opt.textContent = m.id || m;
        modelSelect.appendChild(opt);
      });
      apiStatus.textContent = `✅ 成功拉取 ${data.models.length} 个模型`;
      const savedModel = localStorage.getItem('selectedModel');
      if (savedModel && [...modelSelect.options].some(opt => opt.value === savedModel)) {
        modelSelect.value = savedModel;
      }
    } else {
      apiStatus.textContent = '❌ 拉取失败：' + (data.error || '未知错误');
    }
  } catch (e) {
    apiStatus.textContent = '❌ 请求失败：' + e.message;
  }
});
saveApiBtn.addEventListener('click', () => { saveSettings(true); });
modelSelect.addEventListener('change', () => {
  if (modelSelect.value) localStorage.setItem('selectedModel', modelSelect.value);
});

// ============================================================
// 小说
// ============================================================
document.getElementById('importNovelBtn').addEventListener('click', () => document.getElementById('novelFileInput').click());
document.getElementById('novelFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('novelContent').textContent = ev.target.result;
  };
  reader.readAsText(file, 'UTF-8');
});

// ============================================================
// 音乐
// ============================================================
const audioPlayer = document.getElementById('audioPlayer');
const playPauseBtn = document.getElementById('playPauseBtn');
const musicInfo = document.getElementById('musicInfo');
document.getElementById('importMusicBtn').addEventListener('click', () => document.getElementById('musicFileInput').click());
document.getElementById('musicFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  audioPlayer.src = url;
  audioPlayer.load();
  musicInfo.textContent = `已加载: ${file.name}`;
  playPauseBtn.textContent = '▶️ 播放';
});
playPauseBtn.addEventListener('click', function() {
  if (!audioPlayer.src) { alert('请先导入 MP3 文件'); return; }
  if (audioPlayer.paused) {
    audioPlayer.play().catch(err => alert('播放失败：' + err.message));
    this.textContent = '⏸ 暂停';
  } else {
    audioPlayer.pause();
    this.textContent = '▶️ 播放';
  }
});
audioPlayer.addEventListener('ended', function() {
  playPauseBtn.textContent = '▶️ 播放';
  this.currentTime = 0;
});

// ============================================================
// 初始化
// ============================================================
window.addEventListener('load', async () => {
  document.documentElement.style.backgroundColor = '#F0F4FA';
  document.documentElement.style.colorScheme = 'light';
  document.body.style.backgroundColor = '#F0F4FA';
  applyFullscreen();

  const versionEl = document.getElementById('versionInfo');
  if (versionEl) {
    const lastMod = new Date(document.lastModified);
    versionEl.textContent = 'v1.0.0 · ' + lastMod.toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  const savedBase = localStorage.getItem('apiBase');
  const savedKey = localStorage.getItem('apiKey');
  const savedModel = localStorage.getItem('selectedModel');
  if (savedBase) apiBase.value = savedBase;
  if (savedKey) apiKey.value = savedKey;
  if (savedModel) {
    if (savedBase && savedKey) {
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'models', baseUrl: savedBase, apiKey: savedKey })
        });
        const data = await res.json();
        if (data.models) {
          modelSelect.innerHTML = '<option value="">请选择</option>';
          data.models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id || m;
            opt.textContent = m.id || m;
            modelSelect.appendChild(opt);
          });
          if ([...modelSelect.options].some(opt => opt.value === savedModel)) {
            modelSelect.value = savedModel;
            localStorage.setItem('selectedModel', savedModel);
          }
          apiStatus.textContent = `✅ 自动拉取 ${data.models.length} 个模型`;
          setTimeout(() => { if (apiStatus.textContent.includes('自动拉取')) apiStatus.textContent = '就绪'; }, 3000);
        }
      } catch (e) { console.log('自动拉取失败'); }
    }
  }
  showPage('homePage');
});
</script>
